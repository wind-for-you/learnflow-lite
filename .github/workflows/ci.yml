name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-forbidden-files:
    name: 检查禁止提交的文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 检查 node_modules
        run: |
          if git ls-files | grep -E '^node_modules/'; then
            echo "❌ 错误: node_modules/ 被跟踪，请从 Git 历史中删除"
            exit 1
          fi
      
      - name: 检查构建产物
        run: |
          FORBIDDEN_PATTERNS=(
            '\.next/'
            '\.open-next/'
            '\.wrangler/'
            '\.worker-next/'
            'coverage/'
            '\.dev\.vars'
            '^\.env$'
            '^\.env\.local$'
          )
          
          for pattern in "${FORBIDDEN_PATTERNS[@]}"; do
            if git ls-files | grep -E "$pattern"; then
              echo "❌ 错误: 匹配 $pattern 的文件被跟踪，请从 Git 历史中删除"
              exit 1
            fi
          done
          
          echo "✅ 未发现禁止提交的文件"

  typecheck-and-lint:
    name: 类型检查与 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: TypeScript 类型检查
        run: pnpm typecheck
      
      - name: ESLint 检查
        run: pnpm lint

  test:
    name: 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 运行测试
        run: pnpm test

  build:
    name: 构建检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 哨兵密钥检查 - 构建
        run: |
          export AMPLITUDE_API_KEY="SENTINEL_AMPLITUDE_abc123_SHOULD_NOT_APPEAR"
          export LLM_API_KEY="SENTINEL_LLM_xyz789_SHOULD_NOT_APPEAR"
          pnpm build
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
      
      - name: 哨兵密钥检查 - 验证
        run: |
          SENTINEL_AMPLITUDE="SENTINEL_AMPLITUDE_abc123_SHOULD_NOT_APPEAR"
          SENTINEL_LLM="SENTINEL_LLM_xyz789_SHOULD_NOT_APPEAR"
          
          if [ ! -d ".open-next" ]; then
            echo "❌ .open-next 目录不存在，构建失败"
            exit 1
          fi
          
          if [ ! -d ".next" ]; then
            echo "❌ .next 目录不存在，构建失败"
            exit 1
          fi
          
          LEAKED=0
          
          echo "检查 AMPLITUDE_API_KEY 泄露..."
          if grep -r "$SENTINEL_AMPLITUDE" .open-next/ 2>/dev/null; then
            echo "❌ 在 .open-next 中发现 AMPLITUDE_API_KEY 泄露"
            LEAKED=1
          fi
          if grep -r "$SENTINEL_AMPLITUDE" .next/static/ 2>/dev/null; then
            echo "❌ 在 .next/static 中发现 AMPLITUDE_API_KEY 泄露"
            LEAKED=1
          fi
          
          echo "检查 LLM_API_KEY 泄露..."
          if grep -r "$SENTINEL_LLM" .open-next/ 2>/dev/null; then
            echo "❌ 在 .open-next 中发现 LLM_API_KEY 泄露"
            LEAKED=1
          fi
          if grep -r "$SENTINEL_LLM" .next/static/ 2>/dev/null; then
            echo "❌ 在 .next/static 中发现 LLM_API_KEY 泄露"
            LEAKED=1
          fi
          
          if [ $LEAKED -eq 1 ]; then
            exit 1
          fi
          
          echo "✅ 未发现密钥泄露 (AMPLITUDE_API_KEY, LLM_API_KEY)"
      
      - name: Worker 体积检查 - Wrangler dry-run
        run: |
          OUTPUT=$(pnpm wrangler deploy --dry-run --outdir=.wrangler-output 2>&1 || true)
          echo "$OUTPUT"
          echo "$OUTPUT" > wrangler-dry-run.txt
          
          if [ ! -d ".open-next" ]; then
            echo "❌ 构建产物不存在"
            exit 1
          fi
          
          TOTAL_UPLOAD=$(echo "$OUTPUT" | grep -oP "Total Upload: \K[\d\.]+ (KiB|MiB)" || echo "")
          GZIP_SIZE=$(echo "$OUTPUT" | grep -oP "gzip: \K[\d\.]+ (KiB|MiB)" || echo "")
          
          if [ -z "$TOTAL_UPLOAD" ]; then
            echo "⚠️ 无法从 wrangler 输出解析体积，使用文件大小检查"
            WORKER_FILE=".open-next/server-functions/default/index.mjs"
            if [ -f "$WORKER_FILE" ]; then
              SIZE=$(stat -c%s "$WORKER_FILE" 2>/dev/null || stat -f%z "$WORKER_FILE")
              SIZE_KB=$((SIZE / 1024))
              THRESHOLD_KB=2150
              echo "Worker 文件大小: ${SIZE_KB} KB"
              echo "阈值 (70% of 3MB): ${THRESHOLD_KB} KB"
              if [ $SIZE -gt $((THRESHOLD_KB * 1024)) ]; then
                echo "❌ Worker 体积超过阈值"
                exit 1
              fi
              echo "## Worker 体积检查" >> $GITHUB_STEP_SUMMARY
              echo "- Worker 文件: ${SIZE_KB} KB" >> $GITHUB_STEP_SUMMARY
              echo "- 阈值: ${THRESHOLD_KB} KB (70% of 3MB)" >> $GITHUB_STEP_SUMMARY
              echo "- 状态: ✅ 通过" >> $GITHUB_STEP_SUMMARY
            else
              echo "❌ Worker 文件不存在"
              exit 1
            fi
          else
            echo "## Worker 体积检查" >> $GITHUB_STEP_SUMMARY
            echo "- Total Upload: $TOTAL_UPLOAD" >> $GITHUB_STEP_SUMMARY
            echo "- Gzip: $GZIP_SIZE" >> $GITHUB_STEP_SUMMARY
            
            UPLOAD_NUM=$(echo "$TOTAL_UPLOAD" | grep -oP "[\d\.]+")
            UPLOAD_UNIT=$(echo "$TOTAL_UPLOAD" | grep -oP "(KiB|MiB)")
            
            if [ "$UPLOAD_UNIT" = "MiB" ]; then
              UPLOAD_KB=$(echo "$UPLOAD_NUM * 1024" | bc)
            else
              UPLOAD_KB=$UPLOAD_NUM
            fi
            
            THRESHOLD_KB=2150
            UPLOAD_KB_INT=${UPLOAD_KB%.*}
            
            echo "- 换算: ${UPLOAD_KB_INT} KB" >> $GITHUB_STEP_SUMMARY
            echo "- 阈值: ${THRESHOLD_KB} KB (70% of 3MB)" >> $GITHUB_STEP_SUMMARY
            
            if [ $UPLOAD_KB_INT -gt $THRESHOLD_KB ]; then
              echo "- 状态: ❌ 超过阈值" >> $GITHUB_STEP_SUMMARY
              echo "❌ Worker 体积超过阈值"
              exit 1
            fi
            echo "- 状态: ✅ 通过" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "✅ Worker 体积检查通过"

  e2e:
    name: E2E 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 安装 Playwright
        run: npx playwright install --with-deps chromium
      
      - name: 构建
        run: pnpm build:next
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
      
      - name: 运行 E2E 测试
        run: pnpm test:e2e
      
      - name: 上传测试报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            artifacts/
            test-results/
            playwright-report/
          retention-days: 30

  lighthouse:
    name: Lighthouse 性能测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 构建
        run: pnpm build:next
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
      
      - name: 安装 Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x
      
      - name: 启动服务器
        run: |
          pnpm start &
          echo $! > server.pid
          sleep 10
          
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server ready"
              break
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
      
      - name: 运行 Lighthouse
        run: |
          lhci autorun --config=lighthouserc.json || true
          
          if [ -f ".lighthouseci/lhr-*.json" ]; then
            PERF=$(cat .lighthouseci/lhr-*.json | jq -r '.categories.performance.score')
            A11Y=$(cat .lighthouseci/lhr-*.json | jq -r '.categories.accessibility.score')
            
            echo "## Lighthouse 结果" >> $GITHUB_STEP_SUMMARY
            echo "- Performance: $PERF" >> $GITHUB_STEP_SUMMARY
            echo "- Accessibility: $A11Y" >> $GITHUB_STEP_SUMMARY
            
            PERF_INT=$(echo "$PERF * 100" | bc | cut -d'.' -f1)
            A11Y_INT=$(echo "$A11Y * 100" | bc | cut -d'.' -f1)
            
            if [ $PERF_INT -lt 90 ]; then
              echo "- 状态: ❌ Performance < 0.9" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            
            if [ $A11Y_INT -lt 90 ]; then
              echo "- 状态: ❌ Accessibility < 0.9" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
            
            echo "- 状态: ✅ 通过" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Lighthouse 报告未生成"
          fi
      
      - name: 停止服务器
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) || true
          fi
      
      - name: 上传 Lighthouse 报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30

  cloudflare-deploy-check:
    name: Cloudflare Deploy 检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      
      - name: 构建
        run: pnpm build
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
      
      - name: Wrangler deploy dry-run
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "⚠️ 未配置 CLOUDFLARE_API_TOKEN"
            echo "跳过真实 Cloudflare deploy 检查"
            exit 0
          fi
          
          pnpm deploy:dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
